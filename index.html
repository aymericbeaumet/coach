<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coach+</title>
<meta name="description" content="Coach+ — échauffement et séance du jour, en vidéos." />
<meta name="theme-color" content="#20242c" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="color-scheme" content="dark" />
<meta name="format-detection" content="telephone=no" />
<style>html,body{margin:0;min-height:100%;background:#20242c}</style>

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coach+" />

<link rel="manifest" href="manifest.webmanifest?v=20260812" />
<link rel="icon" href="icons/icon-32.png?v=20260812" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/icon-192.png?v=20260812" sizes="192x192" type="image/png" />
<link rel="icon" href="icons/icon-512.png?v=20260812" sizes="512x512" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260812" sizes="180x180" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="session-progress" id="sessionProgress" role="progressbar" aria-label="Progression de la séance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
<div class="feed" id="feed">
  <section class="screen intro" id="intro">
    <div class="intro-inner">
      <header class="intro-brand">
        <img class="app-logo" src="icons/icon-192.png?v=20260812" width="84" height="84" alt="Coach+" />
        <div class="date" id="date"></div>
      </header>

      <p class="safety-note" role="note">Dos sensible : rester dans une amplitude confortable et passer tout mouvement qui augmente nettement la douleur.</p>

      <section class="block">
        <div class="block-head">
          <div>
            <h2 id="warmupTitle"></h2>
          </div>
        </div>
        <ol class="preview" id="warmupList"></ol>
      </section>

      <section class="block">
        <div class="block-head">
          <div>
            <h2>Séance</h2>
          </div>
        </div>
        <ol class="preview" id="programList"></ol>
      </section>

      <div class="session-footer">
        <div class="session-estimate" aria-label="Estimation de la séance">
          <div><strong id="durationEstimate"></strong><span>Durée estimée</span></div>
          <div><strong id="finishEstimate"></strong><span>Fin estimée</span></div>
        </div>
        <button class="start" id="start">Commencer la séance</button>
      </div>
      <p class="hint" id="install" hidden>Partager → « Sur l'écran d'accueil » pour installer</p>
    </div>
  </section>
  <!-- écrans injectés ici -->
</div>

<div class="active-video" id="activeVideo" hidden>
  <button class="sound-unlock" id="soundUnlock" hidden>Activer le son</button>
</div>
<div class="rail hidden" id="rail" aria-hidden="true"></div>

<script type="module" src="app.js"></script>
</body>
</html>
