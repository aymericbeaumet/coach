<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coach</title>
<meta name="description" content="Coach — la séance du jour : kettlebell + étirements, en vidéos." />
<meta name="theme-color" content="#0f172a" />
<meta name="referrer" content="strict-origin-when-cross-origin" />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coach" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="feed" id="feed">
  <section class="screen intro" id="intro">
    <div class="intro-inner">
      <div class="date" id="date"></div>

      <section class="block">
        <div class="block-head">
          <span class="badge" id="kbBadge">A</span>
          <div>
            <h2 id="kbTitle">Kettlebell — Jour A</h2>
            <p id="kbSub"></p>
          </div>
        </div>
        <ol class="preview" id="kbList"></ol>
      </section>

      <section class="block">
        <div class="block-head">
          <span class="badge alt" id="stBadge">J1</span>
          <div>
            <h2 id="stTitle">Étirements — J1</h2>
            <p id="stSub"></p>
          </div>
        </div>
        <ol class="preview" id="stList"></ol>
      </section>

      <button class="start" id="start">Commencer la séance</button>
      <p class="hint" id="tomorrow"></p>
      <p class="hint" id="install" hidden>Partager → « Sur l'écran d'accueil » pour installer</p>
    </div>
  </section>
  <!-- écrans injectés ici -->
</div>

<div class="rail hidden" id="rail" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
